<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --main: #e2b714;
            --text: #f8fafc;
            --sub: #64748b;
            --error: #ef4444;
            --panel-bg: rgba(30, 41, 59, 0.6);
            --panel-border: rgba(255, 255, 255, 0.1);
            --font: 'JetBrains Mono', monospace;
            --ui-font: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-start);
            color: var(--text);
            font-family: var(--ui-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- ФОН (СЮДА ВСТАВЬ СВОЮ ССЫЛКУ) --- */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Вставь свою ссылку между кавычками ниже: */
            background-image: url('https://i.imgur.com/tY6yVq3.jpeg'); 
            background-size: cover;
            background-position: center;
            filter: brightness(0.2) blur(5px); /* Сильно затемняем и размываем */
            z-index: -2;
        }

        /* Легкий градиент поверх картинки для контраста */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 27, 75, 0.7) 100%);
            z-index: -1;
        }

        /* Анимация пульсации */
        .glow-bg {
            position: absolute;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(226, 183, 20, 0.1) 0%, transparent 60%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 6s infinite alternate;
            z-index: -1;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* --- БЕГУЩИЙ РИК (СПРАЙТ) --- */
        .rick-runner {
            position: absolute;
            bottom: 15%;
            left: -150px;
            width: 100px; height: 100px;
            opacity: 0.3; 
            animation: runAcross 15s linear infinite, wobble 0.4s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes runAcross {
            0% { left: -150px; transform: scaleX(1); }
            49.9% { transform: scaleX(1); }
            50% { left: 100vw; transform: scaleX(-1); }
            99.9% { transform: scaleX(-1); }
            100% { left: -150px; transform: scaleX(1); }
        }

        @keyframes wobble {
            0% { bottom: 15%; transform: rotate(-10deg); }
            100% { bottom: 17%; transform: rotate(10deg); }
        }

        /* --- ШАПКА --- */
        .header {
            width: 100%; max-width: 900px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; z-index: 10;
        }

        .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .logo span { color: var(--main); }

        .settings {
            display: flex; gap: 15px;
            background: rgba(0, 0, 0, 0.5); padding: 10px 20px;
            border-radius: 12px; border: 1px solid var(--panel-border);
            font-family: var(--font); font-size: 14px; color: var(--sub);
            backdrop-filter: blur(10px);
        }

        .setting-btn { cursor: pointer; transition: 0.2s; user-select: none; }
        .setting-btn:hover { color: var(--text); }
        .setting-btn.active { color: var(--main); font-weight: bold; }

        /* --- ЗОНА ПЕЧАТИ --- */
        .typing-area { width: 100%; max-width: 900px; position: relative; z-index: 10; }

        .stats-bar {
            display: flex; gap: 30px; margin-bottom: 20px;
            font-family: var(--font); font-size: 32px; color: var(--main);
            height: 40px; opacity: 0; transition: 0.3s;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .stats-bar.show { opacity: 1; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: var(--sub); font-family: var(--ui-font); text-transform: uppercase; letter-spacing: 1px; text-shadow: none; }

        .timer-display {
            position: absolute; top: -40px; right: 0;
            font-family: var(--font); font-size: 24px; color: var(--main);
            opacity: 0; transition: 0.3s;
        }
        .timer-display.show { opacity: 1; }

        .text-wrapper {
            height: 180px; overflow: hidden; position: relative;
            background: rgba(15, 23, 42, 0.85); 
            padding: 20px; border-radius: 12px; border: 1px solid var(--panel-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .text-display {
            font-family: var(--font); font-size: 28px; line-height: 1.6;
            letter-spacing: 1px; color: var(--sub); user-select: none; outline: none;
        }

        .word { display: inline-block; margin-right: 12px; position: relative; margin-bottom: 5px; }

        .char { position: relative; transition: color 0.1s; }
        .char.correct { color: var(--text); }
        .char.incorrect { color: var(--error); text-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
        .char.incorrect::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--error); }
        
        .char.current { color: var(--main); }
        .char.current::before { 
            content: ''; position: absolute; left: -1px; top: 0; width: 2px; height: 100%; 
            background: var(--main); animation: blink 1s infinite; 
        }
        
        .char.space.current::before { left: 50%; }

        @keyframes blink { 50% { opacity: 0; } }

        #hidden-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: text; z-index: 10;
        }

        /* --- РЕЗУЛЬТАТЫ --- */
        .results-screen { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.5s; }
        .results-screen.show { display: flex; }
        .results-title { font-size: 24px; color: var(--sub); margin-bottom: 20px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .big-stats { display: flex; gap: 50px; margin-bottom: 40px; }
        .big-stat { text-align: center; }
        .big-stat-val { font-size: 64px; font-family: var(--font); color: var(--main); font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .big-stat-label { font-size: 16px; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; }

        .btn-restart {
            background: var(--main); color: var(--bg-start); border: none;
            padding: 15px 40px; font-size: 18px; font-weight: 700;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(226, 183, 20, 0.4);
        }
        .btn-restart:hover { background: #fff; transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- ДОНАТ И ТГ --- */
        .corner-links { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .corner-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border);
            display: flex; justify-content: center; align-items: center;
            color: var(--sub); text-decoration: none; transition: 0.2s; backdrop-filter: blur(10px);
        }
        .corner-btn:hover { color: var(--main); background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .corner-btn svg { width: 22px; height: 22px; }

        @media (max-width: 768px) {
            .text-display { font-size: 22px; }
            .settings { font-size: 12px; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 10px; }
            .header { flex-direction: column; gap: 15px; }
            .big-stats { gap: 20px; }
            .big-stat-val { font-size: 40px; }
            .rick-runner { width: 70px; height: 70px; }
        }
    </style>
</head>

    <script>
        // ... (Огромный словарь, который был до этого) ...
        // Вставляю сокращенную версию, чтобы не спамить, вставь свой полный массив 1000 слов сюда!
        const dict_ru = ["человек", "время", "дело", "жизнь", "день", "рука", "раз", "работа", "слово", "место", "лицо", "друг", "глаз", "вопрос", "дом", "сторона", "страна", "мир", "случай", "голова", "ребенок", "сила", "конец", "вид", "система", "часть", "город", "отношение", "женщина", "деньги", "земля", "машина", "вода", "отец", "проблема", "час", "право", "нога", "решение", "дверь", "образ", "история", "власть", "закон", "война", "бог", "голос", "тысяча", "книга", "возможность", "результат", "ночь", "стол", "имя", "область", "статья", "число", "компания", "народ", "жена", "группа", "развитие", "процесс", "судьба", "условие", "средство", "начало", "свет", "пора", "путь", "душа", "уровень", "форма", "связь", "минута", "улица", "вечер", "качество", "мысль", "дорога", "мать", "действие", "месяц", "государство", "язык", "любовь", "взгляд", "мама", "век", "школа", "цель", "общество", "деятельность", "организация", "президент", "комната", "порядок", "момент", "театр", "письмо", "помощь", "мера", "сон", "звук", "игра", "тело", "вывод", "картина", "центр", "ответ", "брат", "автор", "стена", "интерес", "окно", "опыт", "круг", "сестра", "счет", "план", "проект", "контроль", "смысл", "мальчик", "старуха", "выход", "сцена", "герой", "писатель", "праздник", "лето", "зима", "весна", "осень", "утро", "молоко", "хлеб", "масло", "мясо", "рыба", "яблоко", "дерево", "трава", "цветок", "лист", "небо", "звезда", "солнце", "луна", "ветер", "дождь", "снег", "огонь", "камень", "гора", "река", "море", "лес", "поле", "птица", "собака", "кошка", "лошадь", "медведь", "лиса", "заяц", "волк", "корова", "свинья", "курица", "красный", "белый", "черный", "синий", "зеленый", "желтый", "большой", "маленький", "хороший", "плохой", "новый", "старый", "молодой", "долгий", "короткий", "высокий", "низкий", "быстрый", "медленный", "горячий", "холодный", "сильный", "слабый", "легкий", "трудный", "светлый", "темный", "чистый", "грязный", "богатый", "бедный", "веселый", "грустный", "умный", "глупый", "хра         const texts_ru = ["Программирование — это не просто написание кода. Это искусство решения задач, создания удобных интерфейсов и автоматизации рутины. Нейросети уже пишут за нас базовые функции, но без понимания логики ты не сможешь их исправить. Учись думать, как компьютер, и тогда любые сложные проекты станут тебе по плечу.", "Хороший код должен быть читаемым. Не важно, насколько сложный алгоритм ты написал, если через месяц ты сам не поймешь, что там происходит. Используй понятные имена переменных, разбивай сложные функции на простые и не забывай про комментарии. Чистота кода — это уважение к себе и коллегам."];

        function initGame() {
            clearInterval(timer);
            isPlaying = false; isFinished = false;
            timeLeft = modeValue; charIndex = 0; correctCount = 0; errorCount = 0; startTime = null;
            
            resultsScreen.classList.remove('show');
            statsBar.classList.remove('show');
            textDisplay.style.display = 'block';
            textWrapper.style.display = 'block';
            textWrapper.scrollTop = 0;
            
            generateNewText();
            renderText();
            updateLiveStats(0, 0);
            
            timerDisplay.innerText = mode === 'time' ? `00:${modeValue.toString().padStart(2, '0')}` : `00:00`;
            timerDisplay.classList.add('show');
            
            hiddenInput.value = '';
            hiddenInput.focus();
        }

        function generateNewText() {
            if (mode === 'text') {
                const arr = lang === 'ru' ? texts_ru : texts_en;
                currentText = arr[Math.floor(Math.random() * arr.length)];
            } else {
                const dict = lang === 'ru' ? dict_ru : dict_en;
                let arr = [];
                const count = mode === 'words' ? modeValue : (modeValue === 15 ? 30 : 60);
                for (let i = 0; i < count; i++) {
                    arr.push(dict[Math.floor(Math.random() * dict.length)]);
                }
                currentText = arr.join(' ');
            }
        }

        function renderText() {
            textDisplay.innerHTML = '';
            const wordsArr = currentText.split(' ');
            let globalCharIndex = 0;

            wordsArr.forEach((word, wordIndex) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                word.split('').forEach(char => {
                    const charSpan = document.createElement('span');
                    charSpan.className = 'char';
                    if (globalCharIndex === charIndex) charSpan.classList.add('current');
                    charSpan.innerText = char;
                    charSpan.dataset.index = globalCharIndex;
                    wordSpan.appendChild(charSpan);
                    globalCharIndex++;
                });
                if (wordIndex < wordsArr.length - 1) {
                    const spaceSpan = document.createElement('span');
                    spaceSpan.className = 'char space';
                    if (globalCharIndex === charIndex) spaceSpan.classList.add('current');
                    spaceSpan.innerHTML = '&nbsp;';
                    spaceSpan.dataset.index = globalCharIndex;
                    wordSpan.appendChild(spaceSpan);
                    globalCharIndex++;
                }
                textDisplay.appendChild(wordSpan);
            });
            scrollToCurrentChar();
        }

        function scrollToCurrentChar() {
            const currentEl = document.querySelector(`.char[data-index="${charIndex}"]`);
            if (currentEl) {
                const wrapperRect = textWrapper.getBoundingClientRect();
                const charRect = currentEl.getBoundingClientRect();
                if (charRect.bottom > wrapperRect.bottom - 40) {
                    textWrapper.scrollTop += 45; 
                }
            }
        }

        hiddenInput.addEventListener('input', (e) => {
            if (isFinished) return;
            if (!isPlaying) {
                isPlaying = true; startTime = Date.now(); statsBar.classList.add('show');
                if (mode === 'time') { timer = setInterval(updateTimer, 1000); }
            }
            const typedValue = hiddenInput.value;
            if (typedValue.length > currentText.length) {
                hiddenInput.value = typedValue.slice(0, currentText.length);
                return;
            }
            if (typedValue.length < charIndex) {
                charIndex--;
                const el = document.querySelector(`.char[data-index="${charIndex}"]`);
                if (el) {
                    el.classList.remove('correct', 'incorrect');
                    const nextEl = document.querySelector(`.char[data-index="${charIndex + 1}"]`);
                    if (nextEl) nextEl.classList.remove('current');
                    el.classList.add('current');
                }
                return;
            }
            const expectedChar = currentText[charIndex];
            const typedChar = typedValue[charIndex];
            if (typedChar !== undefined) {
                const el = document.querySelector(`.char[data-index="${charIndex}"]`);
                if (el) {
                    el.classList.remove('current');
                    if (typedChar === expectedChar) { el.classList.add('correct'); correctCount++; }
                    else { el.classList.add('incorrect'); errorCount++; }
                }
                charIndex++;
                const nextEl = document.querySelector(`.char[data-index="${charIndex}"]`);
                if (nextEl) nextEl.classList.add('current');
                updateLiveStats(); scrollToCurrentChar();
                if (charIndex >= currentText.length) finishGame();
            }
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') { e.preventDefault(); initGame(); }
            if (e.key === 'Enter') e.preventDefault();
        });

        function updateTimer() {
            timeLeft--;
            if (timeLeft < 0) timeLeft = 0;
            timerDisplay.innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) finishGame();
        }

        function updateLiveStats(wpm = null, cpm = null) {
            if (!startTime) return;
            if (wpm === null || cpm === null) {
                const timeElapsed = (Date.now() - startTime) / 60000;
                const safeTime = Math.max(timeElapsed, 0.016); 
                wpm = Math.round((correctCount / 5) / safeTime) || 0;
                cpm = Math.round(correctCount / safeTime) || 0;
            }
            document.getElementById('live-wpm').innerText = wpm;
            document.getElementById('live-cpm').innerText = cpm;
        }

        function finishGame() {
            clearInterval(timer); isFinished = true; hiddenInput.blur();
            const timeElapsed = startTime ? (Date.now() - startTime) / 60000 : 1;
            const wpm = Math.round((correctCount / 5) / timeElapsed) || 0;
            const cpm = Math.round(correctCount / timeElapsed) || 0;
            const totalAttempts = correctCount + errorCount;
            const accuracy = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 100;
            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('res-cpm').innerText = cpm;
            document.getElementById('res-acc').innerText = accuracy + '%';
            textWrapper.style.display = 'none';
            statsBar.classList.remove('show');
            timerDisplay.classList.remove('show');
            resultsScreen.classList.add('show');
        }

        function setMode(newMode, value, btn) {
            mode = newMode; if (value) modeValue = value;
            document.querySelectorAll('.settings .setting-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            initGame();
        }

        function setLang(newLang, btn) {
            lang = newLang;
            const ruBtn = document.querySelectorAll('.settings .setting-btn')[0];
            const enBtn = document.querySelectorAll('.settings .setting-btn')[1];
            ruBtn.classList.remove('active'); enBtn.classList.remove('active');
            if(btn) btn.classList.add('active');
            initGame();
        }

        window.onload = () => {
            initGame();
            document.addEventListener('click', (e) => {
                if (!isFinished && !e.target.classList.contains('corner-btn') && e.target.tagName !== 'svg') {
                    hiddenInput.focus();
                }
            });
        };
    </script>
</body>
</html>
